<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" role="img" aria-label="Rose Bar and Restaurant">
  <defs>
    <linearGradient id="gold" x1="40" y1="28" x2="162" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fbf2c8"/>
      <stop offset=".4" stop-color="#e9cb63"/>
      <stop offset=".72" stop-color="#cba23a"/>
      <stop offset="1" stop-color="#9a7619"/>
    </linearGradient>
  </defs>

  <!-- double ring -->
  <circle cx="100" cy="100" r="94" stroke="url(#gold)" stroke-width="3.4"/>
  <circle cx="100" cy="100" r="86.5" stroke="url(#gold)" stroke-width="1.3"/>

  <!-- rose -->
  <g fill="url(#gold)" stroke="#8a6a1c" stroke-width="0.6" stroke-linejoin="round">
    <!-- outer petals -->
    <path d="M100 100 C 82 84 82 56 100 46 C 118 56 118 84 100 100 Z" transform="rotate(0 100 100)"/>
    <path d="M100 100 C 82 84 82 56 100 46 C 118 56 118 84 100 100 Z" transform="rotate(60 100 100)"/>
    <path d="M100 100 C 82 84 82 56 100 46 C 118 56 118 84 100 100 Z" transform="rotate(120 100 100)"/>
    <path d="M100 100 C 82 84 82 56 100 46 C 118 56 118 84 100 100 Z" transform="rotate(180 100 100)"/>
    <path d="M100 100 C 82 84 82 56 100 46 C 118 56 118 84 100 100 Z" transform="rotate(240 100 100)"/>
    <path d="M100 100 C 82 84 82 56 100 46 C 118 56 118 84 100 100 Z" transform="rotate(300 100 100)"/>
    <!-- inner petals -->
    <path d="M100 100 C 91 90 91 72 100 66 C 109 72 109 90 100 100 Z" transform="rotate(30 100 100)"/>
    <path d="M100 100 C 91 90 91 72 100 66 C 109 72 109 90 100 100 Z" transform="rotate(90 100 100)"/>
    <path d="M100 100 C 91 90 91 72 100 66 C 109 72 109 90 100 100 Z" transform="rotate(150 100 100)"/>
    <path d="M100 100 C 91 90 91 72 100 66 C 109 72 109 90 100 100 Z" transform="rotate(210 100 100)"/>
    <path d="M100 100 C 91 90 91 72 100 66 C 109 72 109 90 100 100 Z" transform="rotate(270 100 100)"/>
    <path d="M100 100 C 91 90 91 72 100 66 C 109 72 109 90 100 100 Z" transform="rotate(330 100 100)"/>
  </g>

  <!-- bud -->
  <circle cx="100" cy="100" r="9" fill="url(#gold)" stroke="#8a6a1c" stroke-width="0.6"/>
  <path d="M100 92 a8 8 0 1 1 -5 1.6" fill="none" stroke="#8a6a1c" stroke-width="1" opacity=".55"/>
</svg>
